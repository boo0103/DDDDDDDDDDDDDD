apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paymentalerts-store
  namespace: paymentalerts
spec:
  # Signed manifests + plugin jars live here. Needs to survive pod restarts.
  # ReadWriteOnce is fine because we run only one replica.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard   # uncomment + set if your cluster isn't default
